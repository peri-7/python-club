            <rect x="16" y="26" width="18" height="18"/><rect x="52" y="26" width="18" height="18"/><rect x="88" y="26" width="18" height="18"/><rect x="124" y="26" width="18" height="18"/>
            <rect x="34" y="8" width="18" height="18"/><rect x="70" y="8" width="18" height="18"/><rect x="106" y="8" width="18" height="18"/><rect x="142" y="8" width="18" height="18"/>
          </g>
          <rect x="16" y="8" width="144" height="144" fill="none" stroke="#C5DAF7" stroke-width="1.2"/>
          <!-- reachable squares from d4: column d (x centre 79) and row 4 (y centre 89) -->
          <g fill="#2B6CD9">
            <circle cx="79" cy="17" r="3.2"/><circle cx="79" cy="35" r="3.2"/><circle cx="79" cy="53" r="3.2"/><circle cx="79" cy="71" r="3.2"/>
            <circle cx="79" cy="107" r="3.2"/><circle cx="79" cy="125" r="3.2"/><circle cx="79" cy="143" r="3.2"/>
            <circle cx="25" cy="89" r="3.2"/><circle cx="43" cy="89" r="3.2"/><circle cx="61" cy="89" r="3.2"/>
            <circle cx="97" cy="89" r="3.2"/><circle cx="115" cy="89" r="3.2"/><circle cx="133" cy="89" r="3.2"/><circle cx="151" cy="89" r="3.2"/>
          </g>
          <!-- rook on d4 (simple drawn shape) -->
          <g fill="#143A6B">
            <rect x="72" y="82" width="2.6" height="3"/><rect x="77.7" y="82" width="2.6" height="3"/><rect x="83.4" y="82" width="2.6" height="3"/>
