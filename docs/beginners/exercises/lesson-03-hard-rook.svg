            <text x="8" y="20">8</text><text x="8" y="38">7</text><text x="8" y="56">6</text><text x="8" y="74">5</text>
            <text x="8" y="92">4</text><text x="8" y="110">3</text><text x="8" y="128">2</text><text x="8" y="146">1</text>
