<?xml version="1.0" encoding="UTF-8"?>
<svg width="176" height="176" viewBox="0 0 176 176" xmlns="http://www.w3.org/2000/svg">
          <!-- 8x8 board, square = 18, origin (16,8) -->
          <rect x="16" y="8" width="144" height="144" fill="#FFFFFF"/>
          <!-- dark squares (a1 is dark): file f=0..7, rank r=1..8; dark if (f+r) even -->
          <g fill="#D5E6FB">
            <rect x="16" y="134" width="18" height="18"/><rect x="52" y="134" width="18" height="18"/><rect x="88" y="134" width="18" height="18"/><rect x="124" y="134" width="18" height="18"/>
            <rect x="34" y="116" width="18" height="18"/><rect x="70" y="116" width="18" height="18"/><rect x="106" y="116" width="18" height="18"/><rect x="142" y="116" width="18" height="18"/>
            <rect x="16" y="98" width="18" height="18"/><rect x="52" y="98" width="18" height="18"/><rect x="88" y="98" width="18" height="18"/><rect x="124" y="98" width="18" height="18"/>
            <rect x="34" y="80" width="18" height="18"/><rect x="70" y="80" width="18" height="18"/><rect x="106" y="80" width="18" height="18"/><rect x="142" y="80" width="18" height="18"/>
            <rect x="16" y="62" width="18" height="18"/><rect x="52" y="62" width="18" height="18"/><rect x="88" y="62" width="18" height="18"/><rect x="124" y="62" width="18" height="18"/>
